  <body>
    <div id="root">
      <!-- Pre-React loading state — disappears once React mounts -->
      <style>
        #pre-boot {
          position: fixed; inset: 0; z-index: 200;
          background: #0a0a0f;
          display: flex; align-items: center; justify-content: center;
          font-family: 'JetBrains Mono', 'Courier New', monospace;
        }
        #pre-boot .cursor {
          display: inline-block; width: 8px; height: 16px;
          background: #3b82f6; margin-left: 4px;
          animation: blink-cursor 1s step-end infinite;
        }
        @keyframes blink-cursor { 50% { opacity: 0; } }
      </style>
      <div id="pre-boot">
        <div style="color: #3b82f6; font-size: 13px;">
          <span style="opacity: 0.6;">&gt;</span> Initializing burgersdev workspace<span class="cursor"></span>
        </div>
      </div>
    </div>
